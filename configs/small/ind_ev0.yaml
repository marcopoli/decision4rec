# Decision4Rec v3 pilot (docs/08_architecture_v3.md), Industrial and Scientific, regime R0: a new store with a catalogue only, never
# seen in training. Candidates are the nearest items by text; the statements are text ranks only. Trained baselines
# use all purchase data of this domain and are references, not competitors. Development users (seed 13).
name: ind_ev0
dataset: data/processed/industrial_scientific
out: runs/small/ind
retriever: {kind: evidence, tag: ev000}
evidence: {frac: 0.0, seed: 0, days: 30}
eval: {track: B, K: 30, n_test: 2000, n_valid: 1000, seed: 13, pool: 200, hist_len: 10}
prompt: {max_facts: 3, item_chars: 60, profile_hist: 30, max_hypotheses: 24, max_intents: 10}
item_text:
  embedder: {kind: hf, model: BAAI/bge-small-en-v1.5, pooling: cls, query_prefix: 'Represent this sentence for searching relevant passages: '}
  cache: runs/small/ind/retrieval
reference: ev
benchmark:
  system: ev
  report: [retriever, ev]
  baselines: [pop, itemknn, seqrules, contentknn, transtext, sasrec, sasrecf]
arms:
- {name: retriever, method: retriever}
- {name: ev, method: luce, m: 0, rounds: 2, evidence: stats}     # whole pool, two random orders, statements on
