# Pre-registered confirmatory test of the long-tail gate (docs/04_confirmatory_plan.md, 2026-10-08).
# Fresh users only: every user of an earlier case file of this dataset is excluded. The analysis is fixed in
# advance: `asc --arms wholepool@p0 --only gate,shrink --head 100` (stage `confirm` in scripts/setting.sh).
name: vg_confirm
dataset: data/processed/video_games
out: runs/small/vg
retriever: {kind: sasrec, path: runs/small/vg/sasrec}
eval: {track: B, K: 50, n_test: 3000, n_valid: 500, seed: 29, pool: 200, hist_len: 10, exclude_cases: all}
prompt: {max_facts: 3, item_chars: 300, profile_hist: 30, max_hypotheses: 24, max_intents: 10}
item_text:          # for the training-free baselines reported next to the pre-registered test (no claim)
  embedder: {kind: hf, model: BAAI/bge-small-en-v1.5, pooling: cls, query_prefix: 'Represent this sentence for searching relevant passages: '}
  cache: runs/small/vg/retrieval
reference: wholepool@p0
benchmark:
  system: wholepool@p0
  report: [retriever, wholepool@p0]
  baselines: [gru4rec, sasrec, sasrecf]
arms:
- {name: retriever, method: retriever}
- {name: wholepool@p0, method: luce, m: 0, perm: 0}
