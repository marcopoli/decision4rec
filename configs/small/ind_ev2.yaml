# Decision4Rec v3 pilot, version 2 (docs/08_architecture_v3.md): candidates by one fused score of the generators (scripts/recall_probe.py), Industrial and Scientific: a domain Kev-Rec-E never saw in training. Regime R1:
# the store has its purchase logs but nothing is trained on them, except the trained baselines, which are the bar
# to reach (SASRecF trained here). Development users (seed 13).
name: ind_ev2
dataset: data/processed/industrial_scientific
out: runs/small/ind
retriever: {kind: evidence, tag: ev100f}
evidence: {frac: 1.0, seed: 0, days: 30, fusion: [1, 1, 0.6, 0.3]}
eval: {track: B, K: 30, n_test: 2000, n_valid: 1000, seed: 13, pool: 200, hist_len: 10}
prompt: {max_facts: 3, item_chars: 60, profile_hist: 30, max_hypotheses: 24, max_intents: 10}
item_text:
  embedder: {kind: hf, model: BAAI/bge-small-en-v1.5, pooling: cls, query_prefix: 'Represent this sentence for searching relevant passages: '}
  cache: runs/small/ind/retrieval
reference: ev
benchmark:
  system: ev
  report: [retriever, ev]
  baselines: [pop, itemknn, seqrules, contentknn, transtext, sasrec, sasrecf]
arms:
- {name: retriever, method: retriever}
- {name: ev, method: luce, m: 0, rounds: 2, evidence: stats}     # whole pool, two random orders, statements on
