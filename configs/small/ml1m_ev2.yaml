# MovieLens-1M, a second domain never used to train any decision model (paper Section 5). Ratings, not purchases;
# 3,416 movies and long histories, the farthest scenario from the three shopping domains. Known to be memorized by
# language models: the title-masked control applies. Logs only (R1): the evidence reader on the candidates of the knowledge graph.
# Baselines read from the full grid (runs/tune, trained on .13, 2026-10-11).
name: ml1m_ev2
dataset: data/processed/ml1m
out: runs/small/ml1m
retriever:
  kind: evidence
  tag: ev100f
evidence:
  frac: 1.0
  seed: 0
  days: 30
  fusion:
  - 1
  - 1
  - 0.6
  - 0.3
eval:
  track: B
  K: 30
  n_test: 2000
  n_valid: 1000
  seed: 13
  pool: 200
  hist_len: 10
prompt:
  max_facts: 3
  item_chars: 60
  profile_hist: 30
  max_hypotheses: 24
  max_intents: 10
item_text:
  embedder:
    kind: hf
    model: BAAI/bge-small-en-v1.5
    pooling: cls
    query_prefix: 'Represent this sentence for searching relevant passages: '
  cache: runs/small/ml1m/retrieval
reference: ev
benchmark:
  system: ev
  report:
  - retriever
  - ev
  baselines:
  - pop
  - itemknn
  - seqrules
  - contentknn
  - transtext
  - gru4rec
  - sasrec
  - sasrecf
  common_hp:
    max_len: 200
  root: runs/tune/ml1m/baselines
  grids:
    sasrecf: &id001
    - d: 64
      lr: 0.001
      dropout: 0.2
      n_blocks: 2
    - d: 64
      lr: 0.001
      dropout: 0.5
      n_blocks: 2
    - d: 128
      lr: 0.001
      dropout: 0.2
      n_blocks: 2
    - d: 128
      lr: 0.001
      dropout: 0.5
      n_blocks: 2
    - d: 256
      lr: 0.001
      dropout: 0.2
      n_blocks: 2
    - d: 256
      lr: 0.001
      dropout: 0.5
      n_blocks: 2
    - d: 128
      lr: 0.001
      dropout: 0.3
      n_blocks: 2
    - d: 128
      lr: 0.001
      dropout: 0.2
      n_blocks: 3
    - d: 128
      lr: 0.001
      dropout: 0.5
      n_blocks: 3
    sasrec: *id001
    gru4rec:
    - d: 64
      lr: 0.001
      dropout: 0.2
    - d: 64
      lr: 0.001
      dropout: 0.3
    - d: 64
      lr: 0.001
      dropout: 0.5
    - d: 128
      lr: 0.001
      dropout: 0.2
    - d: 128
      lr: 0.001
      dropout: 0.3
    - d: 128
      lr: 0.001
      dropout: 0.5
    - d: 256
      lr: 0.001
      dropout: 0.2
    - d: 256
      lr: 0.001
      dropout: 0.3
    - d: 256
      lr: 0.001
      dropout: 0.5
    bert4rec:
    - d: 64
      lr: 0.001
      dropout: 0.2
      n_blocks: 2
      mask_prob: 0.3
    - d: 64
      lr: 0.001
      dropout: 0.2
      n_blocks: 2
      mask_prob: 0.5
    - d: 128
      lr: 0.001
      dropout: 0.2
      n_blocks: 2
      mask_prob: 0.3
    - d: 128
      lr: 0.001
      dropout: 0.2
      n_blocks: 2
      mask_prob: 0.5
arms:
- name: retriever
  method: retriever
- name: ev
  method: luce
  m: 0
  rounds: 2
  evidence: stats
