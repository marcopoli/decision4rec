# L2 fair test (docs/19, user yes 2026-11-14): unseen scenario, built like cds (A9); SASRec and SASRecF chosen on validation users
name: ml32m_semantic
dataset: data/processed/ml32m
out: runs/small/ml32m
retriever: {kind: itemknn}     # A9 (2026-11-13): training-free; these cases only score the baselines
eval: {track: B, K: 50, n_test: 1000, n_valid: 300, seed: 13, pool: 200, hist_len: 10}
item_text:
  embedder: {kind: hf, model: BAAI/bge-small-en-v1.5, pooling: cls, query_prefix: 'Represent this sentence for searching relevant passages: '}
  cache: runs/small/ml32m/retrieval
benchmark:
  baselines: [sasrec, sasrecf]
reference: retriever
arms:
- {name: retriever, method: retriever}
