# Decision4Rec-T (docs/07_decision4rec_t.md): a decision model trained on real next-item choices (Kev-Rec) reorders the
# top 30 of the trained SASRec with attributes (SASRecF); the final score fuses both with one weight fitted on validation users. Development users
# (seed 13); the confirmatory test draws fresh users. Prompt settings are those of the training records
# (`export-choices`): 10 history items and 90 characters per item, so training and inference see the same text.
name: steam_rt
dataset: data/processed/steam
out: runs/small/steam
retriever: {kind: baseline, model: sasrecf, ref: configs/small/steam_semantic.yaml, tag: sasrecf}
eval: {track: B, K: 30, n_test: 2000, n_valid: 1000, seed: 13, pool: 200, hist_len: 10}
prompt: {max_facts: 3, item_chars: 90, profile_hist: 30, max_hypotheses: 24, max_intents: 10}
item_text:
  embedder: {kind: hf, model: BAAI/bge-small-en-v1.5, pooling: cls, query_prefix: 'Represent this sentence for searching relevant passages: '}
  cache: runs/small/steam/retrieval
reference: rt
benchmark:
  system: rt
  report: [retriever, rt]
  baselines: [sasrec, sasrecf, seqrules, contentknn, transtext]
arms:
- {name: retriever, method: retriever}
- {name: rt, method: luce, m: 0, rounds: 2}     # whole pool, two random orders in one request
