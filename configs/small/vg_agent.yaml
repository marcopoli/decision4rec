# Small setting: choice-axiom audit (RQ3) and agent study on ActiveGraph (RQ2).
name: vg_agent
dataset: data/processed/video_games
out: runs/small/vg
retriever: {kind: sasrec, path: runs/small/vg/sasrec}
eval: {track: B, K: 50, n_test: 1000, n_valid: 300, seed: 13, pool: 200, hist_len: 10}
prompt: {max_facts: 3, item_chars: 400, profile_hist: 30, max_hypotheses: 24, max_intents: 10}
agent: {k0: 20, step: 15, max_rounds: 2, m: 5, rounds: 2, evidence: pref}
retrieval_agents:
  embedder: {kind: hf, model: BAAI/bge-small-en-v1.5, pooling: cls, query_prefix: 'Represent this sentence for searching relevant passages: '}
  writer: {kind: hf, model: Qwen/Qwen2.5-1.5B-Instruct, max_new_tokens: 48, batch_size: 16}
  agents: [sequential, content, knowledge, collaborative, profile, graph, popularity]
  weights: tuned
  tune_users: 500
  pool: 50
  cache: runs/small/vg/retrieval
arms:
- {name: retriever, method: retriever}
