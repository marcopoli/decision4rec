# A1b mechanism (V41, docs/18, 2026-11-13): the 9B pool reader on the same 2,000 test users as <d>_rtm, with titles masked
# (statements kept) and with all statements dropped (titles kept). Prediction: masking hurts rare targets more, dropping
# statements hurts popular targets more. The rtm arm is the cached normal request.
name: steam_rtmmech
dataset: data/processed/steam
out: runs/small/steam
retriever: {kind: pool, tag: pool}
pool: {ref: configs/small/steam_semantic.yaml, model: sasrecf, users: 15000, seed: 11}
eval: {track: B, K: 30, n_test: 2000, n_valid: 1000, seed: 13, pool: 200, hist_len: 10}
evidence: {frac: 1.0, seed: 0, days: 30, fusion: [1, 1, 0.6, 0.3]}
prompt: {max_facts: 3, item_chars: 90, profile_hist: 30, max_hypotheses: 24, max_intents: 10}
item_text:
  embedder: {kind: hf, model: BAAI/bge-small-en-v1.5, pooling: cls, query_prefix: 'Represent this sentence for searching relevant passages: '}
  cache: runs/small/steam/retrieval
reference: rtm
benchmark:
  system: rtm
  report: [retriever, rtm]
  baselines: [sasrec, sasrecf, seqrules, contentknn, transtext]
arms:
- {name: retriever, method: retriever}
- {name: rtm, method: luce, m: 0, rounds: 2, evidence: stats+found}
- {name: rtm_masked, method: luce, m: 0, rounds: 2, evidence: stats+found, mask_titles: true}   # no titles, in the history or the options
- {name: rtm_text, method: luce, m: 0, rounds: 2, evidence: none}                          # no statements and no found-by: text only
