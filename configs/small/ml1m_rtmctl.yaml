# Contamination controls (2026-10-16, review R2): the pool reader with an empty history (history-free prior)
# and with item titles removed (title-masked), next to the normal request (cached). Stage ctl_08 / ctl_4.
name: ml1m_rtmctl
dataset: data/processed/ml1m
out: runs/small/ml1m
retriever:
  kind: pool
  tag: pool
pool:
  ref: configs/small/ml1m_main.yaml
  model: sasrecf
  users: 3000
  seed: 11
eval:
  track: B
  K: 30
  n_test: 2000
  n_valid: 1000
  seed: 13
  pool: 200
  hist_len: 10
evidence:
  frac: 1.0
  seed: 0
  days: 30
  fusion:
  - 1
  - 1
  - 0.6
  - 0.3
prompt:
  max_facts: 3
  item_chars: 90
  profile_hist: 30
  max_hypotheses: 24
  max_intents: 10
item_text:
  embedder:
    kind: hf
    model: BAAI/bge-small-en-v1.5
    pooling: cls
    query_prefix: 'Represent this sentence for searching relevant passages: '
  cache: runs/small/ml1m/retrieval
reference: rtm
benchmark:
  system: rtm
  report:
  - retriever
  - rtm
  baselines:
  - pop
  - itemknn
  - seqrules
  - contentknn
  - transtext
  - gru4rec
  - sasrec
  - sasrecf
  common_hp:
    max_len: 200
  root: runs/tune/ml1m/baselines
  grids:
    sasrecf: &id001
    - d: 64
      lr: 0.001
      dropout: 0.2
      n_blocks: 2
    - d: 64
      lr: 0.001
      dropout: 0.5
      n_blocks: 2
    - d: 128
      lr: 0.001
      dropout: 0.2
      n_blocks: 2
    - d: 128
      lr: 0.001
      dropout: 0.5
      n_blocks: 2
    - d: 256
      lr: 0.001
      dropout: 0.2
      n_blocks: 2
    - d: 256
      lr: 0.001
      dropout: 0.5
      n_blocks: 2
    - d: 128
      lr: 0.001
      dropout: 0.3
      n_blocks: 2
    - d: 128
      lr: 0.001
      dropout: 0.2
      n_blocks: 3
    - d: 128
      lr: 0.001
      dropout: 0.5
      n_blocks: 3
    sasrec: *id001
    gru4rec:
    - d: 64
      lr: 0.001
      dropout: 0.2
    - d: 64
      lr: 0.001
      dropout: 0.3
    - d: 64
      lr: 0.001
      dropout: 0.5
    - d: 128
      lr: 0.001
      dropout: 0.2
    - d: 128
      lr: 0.001
      dropout: 0.3
    - d: 128
      lr: 0.001
      dropout: 0.5
    - d: 256
      lr: 0.001
      dropout: 0.2
    - d: 256
      lr: 0.001
      dropout: 0.3
    - d: 256
      lr: 0.001
      dropout: 0.5
    bert4rec:
    - d: 64
      lr: 0.001
      dropout: 0.2
      n_blocks: 2
      mask_prob: 0.3
    - d: 64
      lr: 0.001
      dropout: 0.2
      n_blocks: 2
      mask_prob: 0.5
    - d: 128
      lr: 0.001
      dropout: 0.2
      n_blocks: 2
      mask_prob: 0.3
    - d: 128
      lr: 0.001
      dropout: 0.2
      n_blocks: 2
      mask_prob: 0.5
arms:
- name: retriever
  method: retriever
- name: rtm
  method: luce
  m: 0
  rounds: 2
  evidence: stats+found
- name: rtm_prior
  method: luce
  m: 0
  rounds: 2
  evidence: stats+found
  null_state: true
- name: rtm_masked
  method: luce
  m: 0
  rounds: 2
  evidence: stats+found
  mask_titles: true
