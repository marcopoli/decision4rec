# Small setting, RQ1 and RQ2. The fixed system (`decision4rec+fuse`) on a 50-item pool from the retrieval agents.
name: mi_main
dataset: data/processed/musical_instruments
out: runs/small/mi
retriever:
  kind: multi
  tag: multi
  base: {kind: sasrec, path: runs/small/mi/sasrec}
  embedder: {kind: hf, model: BAAI/bge-small-en-v1.5, pooling: cls, query_prefix: 'Represent this sentence for searching relevant passages: '}
  writer: {kind: hf, model: Qwen/Qwen2.5-1.5B-Instruct, max_new_tokens: 48, batch_size: 16}
  agents: [sequential, content, knowledge, collaborative, graph, popularity]
  weights: tuned
  tune_users: 500
  depth: 200
  cache: runs/small/mi/retrieval
eval: {track: B, K: 50, n_test: 1000, n_valid: 300, seed: 13, pool: 200, hist_len: 10}
prompt: {max_facts: 3, item_chars: 300, profile_hist: 30, max_hypotheses: 24, max_intents: 10}
# The agent on ActiveGraph is the primary system of the benchmark (stage `agent`). It compares the pool of K first,
# with the block design of the batch system, and can add 15 candidates for at most two rounds. The routing mode,
# the expansion threshold and the fusion weight are chosen on validation users. Declared before any test number.
agent: {k0: 50, pool: 80, step: 15, max_rounds: 2, m: 10, rounds: 2, evidence: pref, routes: [tuned, decision],
        agents: [sequential, content, knowledge, collaborative, profile, graph, popularity]}
reference: wholepool@p0
benchmark:
  system: decision4rec+fuse
  report: [retriever, wholepool@p0, luce_m10_r2, decision4rec]
  baselines: [pop, itemknn, bprmf, lightgcn, gru4rec, sasrec, sasrecf, bert4rec]
arms:
- {name: retriever, method: retriever}
- {name: wholepool@p0, method: luce, m: 0, perm: 0}
- {name: prior, method: luce, m: 0, perm: 0, null_state: true}
- {name: luce_m10_r2, method: luce, m: 10, rounds: 2}
- {name: decision4rec, method: luce, m: 10, rounds: 2, outside: true, profile: decision, evidence: pref, intent: true}
- {name: decision4rec_masked, method: luce, mask_titles: true, m: 10, rounds: 2, outside: true, profile: decision, evidence: pref, intent: true}
- {name: graph, method: graph}
