# MovieLens-1M enriched (plots from Spillo et al., Binge Watch; properties from Wikidata), with the full architecture (paper Section 4.6): its own SASRecF is one agent of the multi-agent pool,
# the residual ranker is trained on the users of no evaluation case (about 3,000 here), and the decision model, trained
# on the three shopping domains only, reads the 30 best candidates. A domain never used to train the decision model.
# Baselines read from the full grid (runs/tune, trained on .13, 2026-10-11).
name: ml1m_plus_rtm
dataset: data/processed/ml1m_plus
out: runs/small/ml1m_plus
retriever:
  kind: pool
  tag: pool
pool:
  ref: configs/small/ml1m_plus_base.yaml
  model: sasrecf
  users: 3000
  seed: 11
eval:
  track: B
  K: 30
  n_test: 2000
  n_valid: 1000
  seed: 13
  pool: 200
  hist_len: 10
evidence:
  frac: 1.0
  seed: 0
  days: 30
  fusion:
  - 1
  - 1
  - 0.6
  - 0.3
prompt:
  max_facts: 3
  item_chars: 90
  profile_hist: 30
  max_hypotheses: 24
  max_intents: 10
item_text:
  embedder:
    kind: hf
    model: BAAI/bge-small-en-v1.5
    pooling: cls
    query_prefix: 'Represent this sentence for searching relevant passages: '
  cache: runs/small/ml1m_plus/retrieval
reference: rtm
benchmark:
  system: rtm
  report:
  - retriever
  - rtm
  baselines:
  - pop
  - itemknn
  - seqrules
  - contentknn
  - transtext
  - gru4rec
  - sasrec
  - sasrecf
  common_hp:
    max_len: 200
  root: runs/tune/ml1m_plus/baselines
  grids:
    sasrecf: &id001
    - d: 64
      lr: 0.001
      dropout: 0.2
      n_blocks: 2
    - d: 64
      lr: 0.001
      dropout: 0.5
      n_blocks: 2
    - d: 128
      lr: 0.001
      dropout: 0.2
      n_blocks: 2
    - d: 128
      lr: 0.001
      dropout: 0.5
      n_blocks: 2
    - d: 256
      lr: 0.001
      dropout: 0.2
      n_blocks: 2
    - d: 256
      lr: 0.001
      dropout: 0.5
      n_blocks: 2
    - d: 128
      lr: 0.001
      dropout: 0.3
      n_blocks: 2
    - d: 128
      lr: 0.001
      dropout: 0.2
      n_blocks: 3
    - d: 128
      lr: 0.001
      dropout: 0.5
      n_blocks: 3
    sasrec: *id001
    gru4rec:
    - d: 64
      lr: 0.001
      dropout: 0.2
    - d: 64
      lr: 0.001
      dropout: 0.3
    - d: 64
      lr: 0.001
      dropout: 0.5
    - d: 128
      lr: 0.001
      dropout: 0.2
    - d: 128
      lr: 0.001
      dropout: 0.3
    - d: 128
      lr: 0.001
      dropout: 0.5
    - d: 256
      lr: 0.001
      dropout: 0.2
    - d: 256
      lr: 0.001
      dropout: 0.3
    - d: 256
      lr: 0.001
      dropout: 0.5
    bert4rec:
    - d: 64
      lr: 0.001
      dropout: 0.2
      n_blocks: 2
      mask_prob: 0.3
    - d: 64
      lr: 0.001
      dropout: 0.2
      n_blocks: 2
      mask_prob: 0.5
    - d: 128
      lr: 0.001
      dropout: 0.2
      n_blocks: 2
      mask_prob: 0.3
    - d: 128
      lr: 0.001
      dropout: 0.2
      n_blocks: 2
      mask_prob: 0.5
arms:
- name: retriever
  method: retriever
- name: rtm
  method: luce
  m: 0
  rounds: 2
  evidence: stats+found
