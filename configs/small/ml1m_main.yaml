# Small setting, RQ1 and RQ2. The fixed system (`decision4rec+fuse`) on a 50-item pool from the retrieval agents.
# The agent on ActiveGraph is the primary system of the benchmark (stage `agent`). It compares the pool of K first,
# with the block design of the batch system, and can add 15 candidates for at most two rounds. The routing mode,
# the expansion threshold and the fusion weight are chosen on validation users. Declared before any test number.
# Baselines read from the full grid (runs/tune, trained on .13, 2026-10-11).
name: ml1m_main
dataset: data/processed/ml1m
out: runs/small/ml1m
retriever:
  kind: multi
  tag: multi
  base:
    kind: sasrec
    path: runs/small/ml1m/sasrec
  embedder:
    kind: hf
    model: BAAI/bge-small-en-v1.5
    pooling: cls
    query_prefix: 'Represent this sentence for searching relevant passages: '
  writer:
    kind: hf
    model: Qwen/Qwen2.5-1.5B-Instruct
    max_new_tokens: 48
    batch_size: 16
  agents:
  - sequential
  - content
  - knowledge
  - collaborative
  - graph
  - popularity
  weights: tuned
  tune_users: 500
  depth: 200
  cache: runs/small/ml1m/retrieval
eval:
  track: B
  K: 50
  n_test: 1000
  n_valid: 300
  seed: 13
  pool: 200
  hist_len: 10
prompt:
  max_facts: 3
  item_chars: 300
  profile_hist: 30
  max_hypotheses: 24
  max_intents: 10
agent:
  k0: 50
  pool: 80
  step: 15
  max_rounds: 2
  m: 10
  rounds: 2
  evidence: pref
  routes:
  - tuned
  - decision
  agents:
  - sequential
  - content
  - knowledge
  - collaborative
  - profile
  - graph
  - popularity
reference: wholepool@p0
benchmark:
  system: decision4rec+fuse
  report:
  - retriever
  - wholepool@p0
  - luce_m10_r2
  - decision4rec
  baselines:
  - pop
  - itemknn
  - gru4rec
  - sasrec
  - sasrecf
  - bert4rec
  common_hp:
    max_len: 200
  root: runs/tune/ml1m/baselines
  grids:
    sasrecf: &id001
    - d: 64
      lr: 0.001
      dropout: 0.2
      n_blocks: 2
    - d: 64
      lr: 0.001
      dropout: 0.5
      n_blocks: 2
    - d: 128
      lr: 0.001
      dropout: 0.2
      n_blocks: 2
    - d: 128
      lr: 0.001
      dropout: 0.5
      n_blocks: 2
    - d: 256
      lr: 0.001
      dropout: 0.2
      n_blocks: 2
    - d: 256
      lr: 0.001
      dropout: 0.5
      n_blocks: 2
    - d: 128
      lr: 0.001
      dropout: 0.3
      n_blocks: 2
    - d: 128
      lr: 0.001
      dropout: 0.2
      n_blocks: 3
    - d: 128
      lr: 0.001
      dropout: 0.5
      n_blocks: 3
    sasrec: *id001
    gru4rec:
    - d: 64
      lr: 0.001
      dropout: 0.2
    - d: 64
      lr: 0.001
      dropout: 0.3
    - d: 64
      lr: 0.001
      dropout: 0.5
    - d: 128
      lr: 0.001
      dropout: 0.2
    - d: 128
      lr: 0.001
      dropout: 0.3
    - d: 128
      lr: 0.001
      dropout: 0.5
    - d: 256
      lr: 0.001
      dropout: 0.2
    - d: 256
      lr: 0.001
      dropout: 0.3
    - d: 256
      lr: 0.001
      dropout: 0.5
    bert4rec:
    - d: 64
      lr: 0.001
      dropout: 0.2
      n_blocks: 2
      mask_prob: 0.3
    - d: 64
      lr: 0.001
      dropout: 0.2
      n_blocks: 2
      mask_prob: 0.5
    - d: 128
      lr: 0.001
      dropout: 0.2
      n_blocks: 2
      mask_prob: 0.3
    - d: 128
      lr: 0.001
      dropout: 0.2
      n_blocks: 2
      mask_prob: 0.5
arms:
- name: retriever
  method: retriever
- name: wholepool@p0
  method: luce
  m: 0
  perm: 0
- name: prior
  method: luce
  m: 0
  perm: 0
  null_state: true
- name: luce_m10_r2
  method: luce
  m: 10
  rounds: 2
- name: decision4rec
  method: luce
  m: 10
  rounds: 2
  outside: true
  profile: decision
  evidence: pref
  intent: true
- name: decision4rec_masked
  method: luce
  mask_titles: true
  m: 10
  rounds: 2
  outside: true
  profile: decision
  evidence: pref
  intent: true
- name: graph
  method: graph
