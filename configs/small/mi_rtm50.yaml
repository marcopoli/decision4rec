# R18 probe (2026-10-15): as mi_rtm.yaml, but the decision model reads the 50 best of the pool instead of 30. The
# pool reader trained on 30 options reads them without new training; train on 50 only if this gains.
name: mi_rtm50
dataset: data/processed/musical_instruments
out: runs/small/mi
retriever: {kind: pool, tag: pool}
pool: {ref: configs/small/mi_semantic.yaml, model: sasrecf, users: 15000, seed: 11}
eval: {track: B, K: 50, n_test: 2000, n_valid: 1000, seed: 13, pool: 200, hist_len: 10}
evidence: {frac: 1.0, seed: 0, days: 30, fusion: [1, 1, 0.6, 0.3]}
prompt: {max_facts: 3, item_chars: 90, profile_hist: 30, max_hypotheses: 24, max_intents: 10}
item_text:
  embedder: {kind: hf, model: BAAI/bge-small-en-v1.5, pooling: cls, query_prefix: 'Represent this sentence for searching relevant passages: '}
  cache: runs/small/mi/retrieval
reference: rtm
benchmark:
  system: rtm
  report: [retriever, rtm]
  baselines: [gru4rec, sasrec, sasrecf, seqrules, contentknn, transtext]
arms:
- {name: retriever, method: retriever}
- {name: rtm, method: luce, m: 0, rounds: 2, evidence: stats+found}     # 50 best of the pool, statements and the agents that found each item
